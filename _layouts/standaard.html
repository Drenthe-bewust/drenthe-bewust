<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.seo_titel %}{{ page.seo_titel }}{% elsif page.title and page.title != "Home" %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }} – Holistische zorg en welzijn in Drenthe{% endif %}</title>
  <meta name="description" content="{% if page.beschrijving %}{{ page.beschrijving }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.seo_titel %}{{ page.seo_titel }}{% elsif page.title and page.title != "Home" %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }} – Holistische zorg en welzijn in Drenthe{% endif %}">
  <meta property="og:description" content="{% if page.beschrijving %}{{ page.beschrijving }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="nl_NL">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/images/logo-compleet.png">
  <meta name="twitter:card" content="summary_large_image">
  {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
  <meta name="google-site-verification" content="Gvmsr7rui9i2f1ieoPsBe6gmUe7v6Ybiigvw81nkgLM" />
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" href="{{ '/assets/images/logo-icoon.png' | relative_url }}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/stijl.css' | relative_url }}">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "Drenthe-Bewust",
        "url": "https://www.drenthe-bewust.nl",
        "logo": "https://www.drenthe-bewust.nl/assets/images/logo-compleet.png",
        "description": "Platform voor alternatieve zorg, holistische therapie en welzijn in Drenthe, Groningen en Friesland.",
        "email": "info@drenthe-bewust.nl",
        "areaServed": ["Drenthe", "Groningen", "Friesland", "Overijssel"],
        "sameAs": [
          "https://www.facebook.com/share/1NK76U1wML/",
          "https://instagram.com/nederlandbewust2026"
        ]
      },
      {
        "@type": "WebSite",
        "name": "Drenthe-Bewust",
        "url": "https://www.drenthe-bewust.nl",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.drenthe-bewust.nl/onze-bewust-makers/?zoek={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
  </head>
<body>
  {% include nav.html %}
  <main id="content">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/hoofd.js' | relative_url }}"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (!user) {
          window.netlifyIdentity.on("login", function() {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
