[build]
  command = "bundle exec jekyll build --config _config.yml,_config_netlify.yml"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.2.0"
  JEKYLL_ENV = "production"
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/maker-beheer"
  to = "/maker-beheer/"
  status = 301

[[redirects]]
  from = "https://drenthe-bewust.nl/*"
  to = "https://www.drenthe-bewust.nl/:splat"
  status = 301
  force = true

