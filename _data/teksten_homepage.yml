hero_label: Drenthe-Bewust
hero_titel: Dé startpagina voor alternatieve zorg, holistische therapie,
  natuurlijke gezondheid én welzijn in Drenthe en omgeving
hero_subtitel: Vind lokale coaches, therapeuten en behandelaars voor aanvullende
  ondersteuning naast de reguliere zorg.
hero_tekst: >
  Van coaching en massage tot yoga, natuurgeneeskunde en Chinese kruiden.


  Inspiratie, kennis en praktische tips helpen je op weg naar meer balans, energie en gezondheid. Natuurlijk op jouw manier!
hero_knop1: Vind een bewust-maker
hero_knop2: Meld je aan
zoek_titel: 🔍 Zoek een bewust-maker bij jou in de buurt
pijlers_titel: Jij bent meer dan alleen je lichaam
pijlers_tekst: Wat je denkt, voelt en ervaart is met elkaar verbonden. Onze
  bewust-makers werken vanuit drie pijlers.
pijler1_titel: Fysiek, voeding & bewegen
pijler1_tekst: Klachten in je lichaam? Ontdek de holistische benadering van je
  fysieke gezondheid.
pijler2_titel: Mentaal & coaching
pijler2_tekst: Je mentale gezondheid bepaalt hoe je je voelt. Ontdek wat jij
  kunt doen voor een gezond brein.
pijler3_titel: Energie & spirit
pijler3_tekst: Alles is frequentie. Een hoge energiefrequentie betekent dat je
  je blij en gezond voelt.
intake_titel: Weet je niet welke therapie bij je past?
intake_tekst: In een persoonlijk gesprek met Marcella of Elsemarie bespreken we
  jouw situatie. We bepalen samen welke bewust-maker(s) het beste bij jouw
  verhaal past. Gratis, en zonder verplichtingen.
intake_knop: Ja, ik wil een gratis adviesgesprek
cta_titel: Word jij de volgende bewust-maker?
cta_tekst: Zichtbaarheid voor je praktijk, een eigen profielpagina en verbinding
  met gelijkgestemden in Drenthe en omgeving.
