inspiratie_auteur: Judith Hendriks
inspiratie_functie: orthomoleculair therapeut, By Juud
inspiratie_titel: Waarom vakantie niet altijd genoeg is om weer energie te krijgen
inspiratie_intro: "Je bent weer aan het werk na de vakantie, maar voel je je toch
  niet uitgerust? Rust alleen is niet hetzelfde als herstel. Judith legt uit wat
  je lichaam echt nodig heeft om energie op te bouwen — ook richting de herfst."
