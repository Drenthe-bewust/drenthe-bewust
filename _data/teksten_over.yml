# Over-pagina teksten — aanpassen via /admin/
titel: Over Drenthe-bewust
subtitel: Startpagina met een bewuste missie
intro: "Kan jouw innerlijk welzijn en/of fysieke gezondheid wel een steuntje in de rug gebruiken? Kom gemakkelijk in contact met aanbieders uit de regio."
missie_titel: Missie
missie_tekst: Drenthe-bewust brengt jou in verbinding met de Bewust-makers in jouw regio, professionals die je vanuit een holistische visie begeleiden naar een leven in balans.
missie_extra: "Door aandacht te geven aan alle aspecten van jezelf – je lichaam, je mind en je ziel – zowel bewust als onbewust, kun je groeien in verbinding met jezelf. Wanneer je jezelf goed leert kennen, ben je ook in staat de verbinding met anderen te versterken.\n\nWij geloven dat bewustwording je niet alleen inzicht en vertrouwen biedt, maar je OER-sterk maakt. Zo leef je een gezond en gelukkig leven, van binnenuit."
visie_titel: Visie
visie_tekst: Wij dromen van een samenleving waarin zelfbewustzijn vanzelfsprekend is. Een wereld waarin toekomstige generaties opgroeien met ruimte en aandacht om zichzelf écht te leren kennen.
visie_extra: "Een samenleving waarin we leren luisteren naar wat ons lichaam ons wil vertellen. Waar emoties en pijn worden gezien als waardevolle signalen, waardoor de mogelijkheid ontstaat om van binnenuit te helen – voordat klachten zich vastzetten."
visie_quote: Een nieuwe generatie die leeft van binnenuit — vol vertrouwen, verbonden en bruisend van levenslust
