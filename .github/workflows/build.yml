name: Build Jekyll Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: |
          bundle exec jekyll build --config _config.yml,_config_netlify.yml

      - name: Controleer dat de homepage intact is
        run: |
          # Na de build moet index.html nog de homepage zijn, niet een artikel.
          grep -q 'id="page-top"' _site/index.html || { echo "❌ Homepage-marker ontbreekt in _site/index.html"; exit 1; }
          grep -q 'Van onze bewust-maker' _site/index.html || { echo "❌ Blok 'Van onze bewust-maker' ontbreekt op de homepage"; exit 1; }
          echo "✅ Homepage intact"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
