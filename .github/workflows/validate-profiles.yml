name: Validate Bewust-maker Profiles

on:
  pull_request:
    paths:
      - '_bewust-makers/**'
      - '.github/workflows/validate-profiles.yml'
  push:
    branches: [ main ]
    paths:
      - '_bewust-makers/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for problematic permalinks
        run: |
          errors=0

          # Find all bewust-maker files
          for file in _bewust-makers/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              # Check if file has a permalink field that is problematic
              if grep -q "^permalink: /$" "$file"; then
                echo "❌ ERROR in $filename: permalink is root '/'"
                errors=$((errors + 1))
              fi

              if grep -q "^permalink: \"\"$" "$file"; then
                echo "❌ ERROR in $filename: permalink is empty"
                errors=$((errors + 1))
              fi

              if grep -q "^permalink: ''$" "$file"; then
                echo "❌ ERROR in $filename: permalink is empty"
                errors=$((errors + 1))
              fi
            fi
          done

          if [ $errors -gt 0 ]; then
            echo ""
            echo "❌ Validation failed: Found $errors profile(s) with problematic permalinks"
            echo ""
            echo "Rules:"
            echo "  - Do NOT set permalink: /"
            echo "  - Do NOT set permalink: \"\" or permalink: ''"
            echo "  - Let Jekyll auto-generate permalink from filename"
            exit 1
          fi

          echo "✅ All profiles validated successfully"

      - name: Check for index.html conflicts
        run: |
          if grep -r "permalink: /index" _bewust-makers/ 2>/dev/null; then
            echo "❌ ERROR: Found permalink pointing to /index"
            exit 1
          fi
          echo "✅ No index.html conflicts"

      - name: Ensure all permalinks are valid
        run: |
          errors=0

          for file in _bewust-makers/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              # Extract the slug from filename (remove .md)
              slug="${filename%.md}"

              # Check if file has CORRECT permalink
              if ! grep -q "^permalink: /bewust-makers/$slug/$" "$file"; then
                # If file doesn't have permalink OR has wrong one, this is an error
                if grep -q "^permalink:" "$file"; then
                  current=$(grep "^permalink:" "$file" | head -1)
                  echo "❌ ERROR in $filename: $current (should be: /bewust-makers/$slug/)"
                  errors=$((errors + 1))
                else
                  echo "❌ ERROR in $filename: Missing permalink (should be: /bewust-makers/$slug/)"
                  errors=$((errors + 1))
                fi
              fi
            fi
          done

          if [ $errors -gt 0 ]; then
            echo ""
            echo "❌ Validation failed: Found $errors profile(s) with invalid permalinks"
            echo ""
            echo "CRITICAL: Every bewust-maker MUST have a valid permalink!"
            echo "Format: permalink: /bewust-makers/[filename-without-.md]/"
            echo ""
            echo "Examples:"
            echo "  File: amsterdam-coaching.md → permalink: /bewust-makers/amsterdam-coaching/"
            echo "  File: yoga-rotterdam.md → permalink: /bewust-makers/yoga-rotterdam/"
            exit 1
          fi

          echo "✅ All permalinks validated"
