<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Drenthe-Bewust Beheer — Inloggen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #2d5c3a 0%, #4a7c59 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-container {
      background: #fffbf5;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      padding: 3rem 2rem;
      text-align: center;
    }
    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.5rem;
      background: url('/assets/images/logo-wit.png') center / contain no-repeat;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      color: #2d5c3a;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      color: #2d5c3a;
      font-weight: 700;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e8dfc8;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #eaad32;
      box-shadow: 0 0 0 3px rgba(234,173,50,0.1);
    }
    button {
      width: 100%;
      padding: 0.85rem;
      background: #4a7c59;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2d5c3a; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      color: #c00;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: #ffe6e6;
      border-radius: 6px;
      display: none;
    }
    .error.show { display: block; }
    .loading { display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo"></div>
    <h1>Drenthe-Bewust</h1>
    <p>Beheer portal</p>

    <div class="error" id="error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Wachtwoord</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">Inloggen</button>
      <div class="loading" id="loading">Bezig met inloggen...</div>
    </form>
  </div>

  <script>
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const submitBtn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  const errorDiv = document.getElementById('error');

  // Check if already logged in
  if (localStorage.getItem('drenthe_jwt')) {
    window.location.href = '/admin/index.html';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.classList.remove('show');
    submitBtn.disabled = true;
    loading.style.display = 'block';

    try {
      const res = await fetch('https://drenthe-bewust.vercel.app/api/auth/github', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: emailInput.value,
          password: passwordInput.value
        })
      });

      if (!res.ok) {
        const error = await res.json();
        throw new Error(error.error || 'Inloggen mislukt');
      }

      const data = await res.json();
      localStorage.setItem('drenthe_jwt', data.token);
      localStorage.setItem('drenthe_email', data.email);

      window.location.href = '/admin/index.html';
    } catch (err) {
      errorDiv.textContent = '❌ ' + (err.message || 'Inloggen mislukt. Controleer je gegevens.');
      errorDiv.classList.add('show');
      submitBtn.disabled = false;
      loading.style.display = 'none';
    }
  });
  </script>
</body>
</html>
