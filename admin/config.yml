backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Nieuw in {{collection}}: {{slug}}"
    update: "Bijgewerkt in {{collection}}: {{slug}}"
    delete: "Verwijderd uit {{collection}}: {{slug}}"
    uploadMedia: "Afbeelding toegevoegd: {{path}}"
    deleteMedia: "Afbeelding verwijderd: {{path}}"

site_url: https://www.drenthe-bewust.nl
logo_url: /assets/images/logo-compleet.png
editor:
  preview: false
locale: nl
media_folder: assets/images/makers
public_folder: /assets/images/makers

collections:
  - name: bewust-makers
    label: Bewust-makers — Bewerken
    folder: _bewust-makers
    create: false
    media_folder: ../assets/images/makers
    public_folder: /assets/images/makers
    identifier_field: naam
    summary: "{{naam}} — {{stad}}, {{provincie}}"
    fields:
      - { label: "Naam", name: "naam", widget: "string" , hint: "De volledige naam van de therapeut"}
      - { label: "Praktijknaam", name: "praktijk", widget: "string" , hint: "Naam van de praktijk/bedrijf"}
      - { label: "Profielfoto", name: "foto", widget: "image", required: false }
      - { label: "Provincie", name: "provincie", widget: "select", options: ["Drenthe","Groningen","Friesland","Overijssel","Gelderland","Utrecht","Noord-Holland","Zuid-Holland","Zeeland","Noord-Brabant","Limburg","Flevoland"] , hint: "In welke provincie werk je"}
      - { label: "Stad", name: "stad", widget: "string", hint: "Plaats waar je voornamelijk werk" }
      - { label: "Categorieën", name: "categorieen", widget: "select", multiple: true, options: ["Massage","Coaching","Voeding","Energetisch","Bewegen","Meditatie","Mindfulness","Lichaamsgericht","Spiritueel","Psychosociaal"], hint: "Wat zijn je specialisaties (massage, coaching, etc)" }
      - { label: "Methoden", name: "methoden", widget: "list" , hint: "Welke behandelmethoden gebruik je"}
      - { label: "Klachten", name: "klachten", widget: "list", required: false, hint: "Welke klachten kun je helpen (stress, rugpijn, etc)" }
      - { label: "Kaart-tags", name: "kaart_tags", widget: "list", required: false, hint: "3 korte labels voor de profielkaart" }
      - { label: "Citaat op homepage", name: "citaat", widget: "string", required: false, hint: "Inspirerend citaat of je motto" }
      - { label: "Volgorde", name: "volgorde", widget: "number", required: false, value_type: "int", hint: "Bepaalt de volgorde op de overzichtspagina (laag getal = eerder getoond). Laat leeg voor standaardvolgorde." }
      - { label: "Locatie — breedtegraad (optioneel)", name: "lat", widget: "string", required: false, hint: "Alleen invullen als je een nauwkeurigere locatie wilt dan de stad. Zoek je adres op via maps.google.nl, klik rechts op de pin → eerste getal (bijv. 52.7697)." }
      - { label: "Locatie — lengtegraad (optioneel)", name: "lon", widget: "string", required: false, hint: "Alleen invullen als je een nauwkeurigere locatie wilt dan de stad. Zoek je adres op via maps.google.nl, klik rechts op de pin → tweede getal (bijv. 6.9142)." }
      - { label: "Korte omschrijving (zoekresultaat)", name: "omschrijving", widget: "text", required: false, hint: "Korte beschrijving (1-2 zinnen)" }
      - { label: "Website", name: "website", widget: "string", required: false , hint: "Jouw website of webpagina"}
      - { label: "E-mailadres zichtbaar", name: "email_zichtbaar", widget: "string", required: false , hint: "Email die zichtbaar is op je profiel"}
      - { label: "Telefoonnummer", name: "telefoon", widget: "string", required: false , hint: "Telefoonnummer voor cliënten"}
      - { label: "Online sessies", name: "online", widget: "select", options: ["Ja","Nee","Op aanvraag"], default: "Op aanvraag" , hint: "Bied je online sessies aan"}
      - { label: "Sessieduur", name: "sessieduur", widget: "string", required: false , hint: "Hoe lang duurt een typische sessie (bijv. 30-60 min)"}
      - { label: "Tarief", name: "tarief", widget: "string", required: false , hint: "Wat zijn je tarieven (bijv. €50 per sessie)"}
      - { label: "Eerste gesprek", name: "eerste_gesprek", widget: "select", options: ["Gratis kennismaking","Gratis (30 min)","Op aanvraag","Betaald"], default: "Gratis kennismaking" , hint: "Is het eerste gesprek gratis of betaald"}
      - { label: "Vergoeding", name: "vergoeding", widget: "string", required: false , hint: "Vergoeding door zorgverzekeraars"}
      - { label: "Ervaringsjaren", name: "ervaringsjaren", widget: "number", required: false, value_type: "int" , hint: "Hoeveel jaar ervaring heb je"}
      - { label: "Talen", name: "talen", widget: "list", default: ["Nederlands"] , hint: "Welke talen spreek je"}
      - { label: "Doelgroepen", name: "doelgroepen", widget: "list", required: false , hint: "Voor wie is je werk (ouderen, kinderen, etc)"}
      - { label: "Opleidingen", name: "opleidingen", widget: "list", required: false , hint: "Je opleidingen en certificaten"}
      - { label: "Verenigingen", name: "verenigingen", widget: "list", required: false , hint: "Lidmaatschappen van beroepsorganisaties"}
      - { label: "Bio (korte introductie)", name: "bio", widget: "text", hint: "Je introductieparagraaf (wie ben je, wat doe je)" }
      - { label: "Waarom is dit jouw werk?", name: "waarom", widget: "text", required: false, hint: "Waarom ben je deze werkzaamheden gaan doen" }
      - { label: "Wat maakt jou anders?", name: "onderscheid", widget: "text", required: false, hint: "Wat maakt jou anders van andere therapeuten" }
      - { label: "Waarom bel je mij?", name: "voor_wie", widget: "text", required: false, hint: "Voor wie is jouw werk ideaal" }
      - { label: "Wat zeggen cliënten over jou?", name: "wat_zeggen_clienten", widget: "text", required: false, hint: "Wat zeggen tevreden cliënten over je" }
      - { label: "Wat neem je mee na een sessie?", name: "na_sessie", widget: "text", required: false, hint: "Wat kunnen cliënten verwachten na een sessie" }
      - { label: "Gepubliceerd", name: "gepubliceerd", widget: "boolean", default: true , hint: "✅ AAN = profiel gaat live. ❌ UIT = verborgen"}
      - { label: "Uitgelicht", name: "uitgelicht", widget: "boolean", default: false, hint: "Toont deze bewust-maker op de homepage" }
      - { label: "Lidmaatschap", name: "lidmaatschap", widget: "select", options: ["Bewust-maker","Mee-maker"], default: "Bewust-maker" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "bewust-maker" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: "" }

  - name: bewust-makers-aanmeldingen
    label: Tally-aanmeldingen — Modereren (ALLE VELDEN)
    folder: _bewust-makers-pending
    create: false
    media_folder: ../assets/images/makers
    public_folder: /assets/images/makers
    identifier_field: naam
    summary: "{{naam}} — {{stad}}, {{provincie}}"
    fields:
      - { label: "Naam", name: "naam", widget: "string" , hint: "De volledige naam van de therapeut"}
      - { label: "Praktijknaam", name: "praktijk", widget: "string" , hint: "Naam van de praktijk/bedrijf"}
      - { label: "Provincie", name: "provincie", widget: "select", options: ["Drenthe","Groningen","Friesland","Overijssel","Gelderland","Utrecht","Noord-Holland","Zuid-Holland","Zeeland","Noord-Brabant","Limburg","Flevoland"] , hint: "In welke provincie werk je"}
      - { label: "Stad", name: "stad", widget: "string" }
      - { label: "Categorieën", name: "categorieen", widget: "select", multiple: true, options: ["Massage","Coaching","Voeding","Energetisch","Bewegen","Meditatie","Mindfulness","Lichaamsgericht","Spiritueel","Psychosociaal"] }
      - { label: "Methoden", name: "methoden", widget: "list", required: false , hint: "Welke behandelmethoden gebruik je"}
      - { label: "Klachten", name: "klachten", widget: "list", required: false }
      - { label: "Kaart-tags", name: "kaart_tags", widget: "list", required: false }
      - { label: "Doelgroepen", name: "doelgroepen", widget: "list", required: false , hint: "Voor wie is je werk (ouderen, kinderen, etc)"}
      - { label: "Opleidingen", name: "opleidingen", widget: "list", required: false , hint: "Je opleidingen en certificaten"}
      - { label: "Verenigingen", name: "verenigingen", widget: "list", required: false , hint: "Lidmaatschappen van beroepsorganisaties"}
      - { label: "Talen", name: "talen", widget: "list", default: ["Nederlands"], required: false , hint: "Welke talen spreek je"}
      - { label: "Website", name: "website", widget: "string", required: false , hint: "Jouw website of webpagina"}
      - { label: "E-mailadres zichtbaar", name: "email_zichtbaar", widget: "string", required: false , hint: "Email die zichtbaar is op je profiel"}
      - { label: "Telefoonnummer", name: "telefoon", widget: "string", required: false , hint: "Telefoonnummer voor cliënten"}
      - { label: "Online sessies", name: "online", widget: "select", options: ["Ja","Nee","Op aanvraag"], default: "Op aanvraag", required: false , hint: "Bied je online sessies aan"}
      - { label: "Sessieduur", name: "sessieduur", widget: "string", required: false , hint: "Hoe lang duurt een typische sessie (bijv. 30-60 min)"}
      - { label: "Tarief (€)", name: "tarief", widget: "string", required: false , hint: "Wat zijn je tarieven (bijv. €50 per sessie)"}
      - { label: "Eerste gesprek", name: "eerste_gesprek", widget: "select", options: ["Gratis kennismaking","Gratis (30 min)","Op aanvraag","Betaald"], default: "Gratis kennismaking", required: false , hint: "Is het eerste gesprek gratis of betaald"}
      - { label: "Vergoeding zorgverzekeraar", name: "vergoeding", widget: "string", required: false , hint: "Vergoeding door zorgverzekeraars"}
      - { label: "Jaren ervaring", name: "ervaringsjaren", widget: "number", required: false, value_type: "int" , hint: "Hoeveel jaar ervaring heb je"}
      - { label: "Korte omschrijving", name: "omschrijving", widget: "text", required: false }
      - { label: "Citaat of tagline", name: "citaat", widget: "string", required: false }
      - { label: "Bio (korte introductie)", name: "bio", widget: "text" }
      - { label: "Waarom is dit jouw werk?", name: "waarom", widget: "text", required: false }
      - { label: "Wat maakt jou anders?", name: "onderscheid", widget: "text", required: false }
      - { label: "Waarom bel je mij?", name: "voor_wie", widget: "text", required: false }
      - { label: "Wat zeggen cliënten over jou?", name: "wat_zeggen_clienten", widget: "text", required: false }
      - { label: "Wat neem je mee na een sessie?", name: "na_sessie", widget: "text", required: false }
      - { label: "Gepubliceerd", name: "gepubliceerd", widget: "boolean", default: false, hint: "✅ AAN = profiel gaat live. ❌ UIT = verborgen"}
      - { label: "Layout", name: "layout", widget: "hidden", default: "bewust-maker" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: "" }

  - name: bewust-makers-nieuw
    label: Bewust-maker — Nieuw toevoegen
    folder: _bewust-makers
    create: true
    media_folder: ../assets/images/makers
    public_folder: /assets/images/makers
    identifier_field: naam
    summary: "{{naam}}"
    fields:
      - { label: "Naam", name: "naam", widget: "string" , hint: "De volledige naam van de therapeut"}
      - { label: "Praktijknaam", name: "praktijk", widget: "string" , hint: "Naam van de praktijk/bedrijf"}
      - { label: "Provincie", name: "provincie", widget: "select", options: ["Drenthe","Groningen","Friesland","Overijssel","Gelderland","Utrecht","Noord-Holland","Zuid-Holland","Zeeland","Noord-Brabant","Limburg","Flevoland"] , hint: "In welke provincie werk je"}
      - { label: "Stad", name: "stad", widget: "string" }
      - { label: "Bio", name: "bio", widget: "text", hint: "Je introductieparagraaf (wie ben je, wat doe je)" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "bewust-maker" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: "" }

  - name: agenda
    label: Agenda — Evenementen
    folder: _agenda
    create: true
    identifier_field: titel
    summary: "{{titel}} — {{datum}}"
    fields:
      - { label: "Titel", name: "titel", widget: "string" }
      - { label: "Datum (yyyy-mm-dd)", name: "datum", widget: "string", pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Datum in formaat yyyy-mm-dd"] }
      - { label: "Tijd (uu:mm)", name: "tijd", widget: "string", required: false, pattern: ["^\\d{2}:\\d{2}$", "Tijd in formaat uu:mm"] }
      - { label: "Organisator", name: "organisator", widget: "string", required: false }
      - { label: "Locatie", name: "locatie", widget: "string", required: false }
      - { label: "Beschrijving", name: "beschrijving", widget: "text" }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "agenda-item" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: "" }

  - name: mee-makers
    label: Mee-makers
    folder: _mee-makers
    create: true
    identifier_field: naam
    summary: "{{naam}}"
    media_folder: ../assets/images/mee-makers
    public_folder: /assets/images/mee-makers
    fields:
      - { label: "Naam", name: "naam", widget: "string" , hint: "De volledige naam van de therapeut"}
      - { label: "Logo", name: "logo", widget: "image", required: false }
      - { label: "Website", name: "website", widget: "string", required: false , hint: "Jouw website of webpagina"}
      - { label: "Beschrijving", name: "beschrijving", widget: "text" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "mee-maker" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: "" }

  - name: kennisbank
    label: Kennisbank
    folder: _kennisbank
    create: true
    identifier_field: titel
    summary: "{{titel}}"
    fields:
      - { label: "Titel", name: "titel", widget: "string" }
      - { label: "Inhoud", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "kennisbank-artikel" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: "" }

  - name: teksten
    label: Teksten aanpassen
    files:
      - label: "Homepage"
        name: "homepage"
        file: "_data/teksten_homepage.yml"
        fields:
          - { label: "Hoofdtitel", name: "hero_titel", widget: "string" }
          - { label: "Subtitel", name: "hero_subtitel", widget: "string" }
          - { label: "Hero tekst", name: "hero_tekst", widget: "text" }
          - { label: "Knop 1 (Bewust-makers)", name: "hero_knop1", widget: "string" }
          - { label: "Knop 2 (Meld je aan)", name: "hero_knop2", widget: "string" }
          - { label: "Zoekbalk titel", name: "zoek_titel", widget: "string" }
          - { label: "Pijlers titel", name: "pijlers_titel", widget: "string" }
          - { label: "Pijlers tekst", name: "pijlers_tekst", widget: "text" }
          - { label: "Pijler 1 titel", name: "pijler1_titel", widget: "string" }
          - { label: "Pijler 1 tekst (kort)", name: "pijler1_tekst", widget: "text" }
          - { label: "Pijler 2 titel", name: "pijler2_titel", widget: "string" }
          - { label: "Pijler 2 tekst (kort)", name: "pijler2_tekst", widget: "text" }
          - { label: "Pijler 3 titel", name: "pijler3_titel", widget: "string" }
          - { label: "Pijler 3 tekst (kort)", name: "pijler3_tekst", widget: "text" }
          - { label: "Adviesgesprek titel", name: "intake_titel", widget: "string" }
          - { label: "Adviesgesprek tekst", name: "intake_tekst", widget: "text" }
          - { label: "Adviesgesprek knop", name: "intake_knop", widget: "string" }
          - { label: "CTA titel", name: "cta_titel", widget: "string" }
          - { label: "CTA tekst", name: "cta_tekst", widget: "text" }

  - name: uitnodigingen
    label: Bewust-maker uitnodigen
    files:
      - label: "Uitnodiging"
        name: "uitnodiging"
        file: "_data/uitnodigingen.yml"
        fields:
          - { label: "Naam", name: "naam", widget: "string" , hint: "De volledige naam van de therapeut"}
          - { label: "E-mailadres", name: "email", widget: "string" }
          - { label: "Type", name: "type", widget: "select", options: ["Bewust-maker","Mee-maker"], default: "Bewust-maker" }
          - { label: "Notitie", name: "notitie", widget: "text", required: false }
          - { label: "Status", name: "status", widget: "select", options: ["Te verwerken","Uitnodiging verstuurd","Actief"], default: "Te verwerken" }
